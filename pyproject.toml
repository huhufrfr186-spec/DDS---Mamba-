[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dds-mamba"
version = "0.1.0"
description = "Deterministic reference controller for DDS-Mamba"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4", "pyyaml==6.0.2", "pillow==10.3.0", "torch==2.2.2", "timm==1.0.19"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
